<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #00d4ff;
    font-family: 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .orb {
    width: 200px; height: 200px;
    border-radius: 50%;
    background: radial-gradient(circle, #00d4ff 0%, #003366 70%, #000 100%);
    box-shadow: 0 0 60px #00d4ff, inset 0 0 40px #0088ff;
    animation: pulse 2s infinite;
    margin-bottom: 30px;
  }
  .orb.listening { animation: pulse 0.5s infinite, glow 1s infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes glow { 0%,100% { box-shadow: 0 0 60px #00d4ff; } 50% { box-shadow: 0 0 100px #00ffff; } }
  h1 { font-size: 2em; letter-spacing: 8px; margin-bottom: 20px; }
  #status { font-size: 1.1em; margin-bottom: 20px; min-height: 1.5em; }
  #transcript {
    background: rgba(0,212,255,0.1);
    border: 1px solid #00d4ff;
    padding: 15px;
    border-radius: 10px;
    width: 90%;
    max-width: 500px;
    min-height: 60px;
    margin-bottom: 20px;
    text-align: center;
  }
  button {
    background: transparent;
    color: #00d4ff;
    border: 2px solid #00d4ff;
    padding: 15px 40px;
    font-size: 1.2em;
    border-radius: 30px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 3px;
  }
  button:active { background: #00d4ff; color: #000; }
</style>
</head>
<body>
  <h1>J.A.R.V.I.S</h1>
  <div class="orb" id="orb"></div>
  <div id="status">Toque para falar</div>
  <div id="transcript">—</div>
  <button id="btn">🎤 FALAR</button>

<script>
const orb = document.getElementById('orb');
const status = document.getElementById('status');
const transcript = document.getElementById('transcript');
const btn = document.getElementById('btn');

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'pt-BR';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = (e) => {
    const texto = e.results[0][0].transcript.toLowerCase();
    transcript.textContent = `"${texto}"`;
    executar(texto);
  };
  recognition.onend = () => {
    orb.classList.remove('listening');
    status.textContent = 'Toque para falar';
  };
  recognition.onerror = (e) => {
    status.textContent = 'Erro: ' + e.error;
    orb.classList.remove('listening');
  };
}

function falar(texto) {
  status.textContent = texto;
  const utter = new SpeechSynthesisUtterance(texto);
  utter.lang = 'pt-BR';
  utter.rate = 1.05;
  speechSynthesis.speak(utter);
}

function executar(cmd) {
  if (cmd.includes('horas') || cmd.includes('hora')) {
    const h = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    falar(`Agora são ${h}.`);
  }
  else if (cmd.includes('data') || cmd.includes('dia é')) {
    const d = new Date().toLocaleDateString('pt-BR');
    falar(`Hoje é ${d}.`);
  }
  else if (cmd.includes('youtube')) {
    falar('Abrindo YouTube.');
    window.open('https://youtube.com');
  }
  else if (cmd.includes('pesquise') || cmd.includes('buscar')) {
    const termo = cmd.replace(/pesquise|buscar/g, '').trim();
    falar(`Pesquisando ${termo}.`);
    window.open(`https://www.google.com/search?q=${encodeURIComponent(termo)}`);
  }
  else if (cmd.includes('olá') || cmd.includes('oi jarvis')) {
    falar('Olá, senhor. Como posso ajudar?');
  }
  else if (cmd.includes('tchau') || cmd.includes('sair')) {
    falar('Até mais, senhor.');
  }
  else {
    falar('Ainda não sei fazer isso, senhor.');
  }
}

btn.addEventListener('click', () => {
  if (!recognition) {
    status.textContent = 'Seu navegador não suporta voz';
    return;
  }
  orb.classList.add('listening');
  status.textContent = 'Ouvindo...';
  transcript.textContent = '...';
  recognition.start();
});

window.onload = () => falar('Jarvis online. Como posso ajudar?');
</script>
</body>
</html>
